<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Watt — energy-consumption dashboard for small hotels and rural houses."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Watt · Energy dashboard</title>
    <script>
      // Apply the saved theme before first paint (no light/dark flash).
      try {
        const theme = localStorage.getItem('watt-theme');
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
